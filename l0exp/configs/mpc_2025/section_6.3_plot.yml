experiment: section_6.3

dataset:
  type: mixture
  args: 
    k           : 10
    m           : 500
    n           : 1000
    r           : 0.9
    s           : 10.
    seed        : null
    distrib_name: uniform
    distrib_args: {low: -1.0, high: 1.0}

calibration:
  type: mixture
  args:
    distrib_name: uniform
    distrib_args: {low: -1.0, high: 1.0}

solvers:
  type: ANY
  args: {time_limit: 3600., relative_gap: 1.e-8, verbose: false}

action:
  type: solve
  args: {}

graphics:
  solve_statistics:
    type: solve_statistics
    args: {ylabel: time, yscale: log}
