experiment: section_6.2

dataset:
  type: mixture
  args: 
    k           : 10
    m           : 500
    n           : 1000
    r           : 0.9
    s           : 10.
    seed        : null
    distrib_name: uniform
    distrib_args: {low: -1.0, high: 1.0}
    # distrib_name: gaussian
    # distrib_args: {scale: 1.0}
    # distrib_name: laplace
    # distrib_args: {scale: 1.0}
    # distrib_name: exponential
    # distrib_args: {scale: 1.0}
    # distrib_name: halfgaussian
    # distrib_args: {scale: 1.0}
    # distrib_name: gausslaplace
    # distrib_args: {scale1: 1.0, scale2: 1.0}


calibration:
  type: mixture
  args:
    distrib_name: uniform
    distrib_args: {low: -1.0, high: 1.0}
    # distrib_name: gaussian
    # distrib_args: {scale: 1.0}
    # distrib_name: laplace
    # distrib_args: {scale: 1.0}
    # distrib_name: exponential
    # distrib_args: {scale: 1.0}
    # distrib_name: halfgaussian
    # distrib_args: {scale: 1.0}
    # distrib_name: gausslaplace
    # distrib_args: {scale1: 1.0, scale2: 1.0}

solvers:
  type: ANY
  args: {time_limit: 600., relative_gap: 1.e-8, verbose: false}

action:
  type: solve
  args: {}

graphics:
  solve_profile:
    type: solve_profile
    args: 
      normalize : false
      time_min  : 1.e-2
      time_max  : 1.e+4
      time_num  : 70
      xscale    : log
      xlabel    : time
      ylabel    : solved
