experiment: section_6.1

dataset:
  type: hardcoded
  args: {name: drug, normalize: true}

calibration:
  type: hardcoded
  args:
    datafit       : Leastsquares
    penalty       : BigmL2norm
    lmbd          : 6.388764414246429
    datafit_params: {}
    penalty_params: {M: 5.3827753993888035, beta: 0.5186469371627186}

solvers:
  el0ps:
    type: el0ps
    args: {time_limit: 3600., relative_gap: 1.e-8, verbose: false}
  l0bnb:
    type: l0bnb
    args: {time_limit: 3600., relative_gap: 1.e-8, verbose: false}
  mimosa:
    type: mimosa
    args: {time_limit: 3600., relative_gap: 1.e-8, verbose: false}
  gurobi:
    type: gurobi
    args: {time_limit: 3600., relative_gap: 1.e-8, verbose: false}
  mosek:
    type: mosek
    args: {time_limit: 3600., relative_gap: 1.e-8, verbose: false}
  oa:
    type: oa
    args: {time_limit: 3600., relative_gap: 1.e-8, verbose: false}

action:
  type: path
  args: {lmbd_max: 1.0, lmbd_min: 0.01, lmbd_num: 21}
