experiment: section_6.1

dataset:
  type: hardcoded
  args: {name: kits, normalize: true}

calibration:
  type: hardcoded
  args:
    datafit       : Leastsquares
    penalty       : BigmL1L2norm
    lmbd          : 0.04728410277698789
    datafit_params: {}
    penalty_params: {M: 0.5759839750528222, alpha: 0.1, beta: 1.0}

solvers:
  type: ANY
  args: {time_limit: 3600., relative_gap: 1.e-8, verbose: false}

action:
  type: path
  args: {lmbd_max: 1.0, lmbd_min: 0.01, lmbd_num: 21}

graphics:
  path_time:
    type: path_time
    args: 
      xlabel      : lmbd
      xscale      : log
      invert_xaxis: true
      ylabel      : time
      yscale      : log
